name: Build Farla Tweaks

on:
  push:
    branches: [main, agent/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore FarlaTweaks.sln

      - name: Build
        run: dotnet build FarlaTweaks.sln --configuration Release --no-restore

      - name: Publish single-file Windows build
        run: >-
          dotnet publish src/FarlaTweaks.App/FarlaTweaks.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/FarlaTweaks
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create executable checksum
        shell: pwsh
        run: |
          (Get-FileHash artifacts/FarlaTweaks/FarlaTweaks.exe -Algorithm SHA256).Hash | Set-Content artifacts/FarlaTweaks/FarlaTweaks.exe.sha256

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc 'installer\FarlaTweaks.iss'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload standalone Windows build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FarlaTweaks-Windows-x64
          path: |
            artifacts/FarlaTweaks/FarlaTweaks.exe
            artifacts/FarlaTweaks/FarlaTweaks.exe.sha256
          if-no-files-found: warn

      - name: Upload Windows installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FarlaTweaks-Windows-x64-Installer
          path: artifacts/installer/*.exe
          if-no-files-found: warn

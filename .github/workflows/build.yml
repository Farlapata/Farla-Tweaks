name: Build Farla Tweaks

on:
  push:
    branches: [main, agent/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore FarlaTweaks.sln

      - name: Build
        run: dotnet build FarlaTweaks.sln --configuration Release --no-restore

      - name: Publish single-file Windows build
        run: >-
          dotnet publish src/FarlaTweaks.App/FarlaTweaks.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/FarlaTweaks
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: FarlaTweaks-Windows-x64
          path: artifacts/FarlaTweaks/FarlaTweaks.exe
          if-no-files-found: error
